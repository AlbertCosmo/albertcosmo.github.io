<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Enrichment (F26): Course Introduction</title>
<style>body{margin:0;font:21px/1.66 ui-sans-serif,-apple-system,sans-serif;background:#fbfaf8;color:#0d0d0d} .loading{padding:80px 30px;text-align:center;color:#67655f}</style>
</head>
<body>
<div class="loading">Loading full page…</div>
<script>
(async () => {
  const res = await fetch('https://raw.githubusercontent.com/AlbertCosmo/albertcosmo.github.io/dae3fe059936ffc073e0d57345f63d249b28e9df/89154/index.html');
  let html = await res.text();

  const old = `    <div class="week">
      <div class="wk">Week 6</div>
      <div><h3>No Brainer</h3><p>Unit 6.</p></div>
    </div>`;

  const neu = `    <details class="wk2" id="week-6">
      <summary class="week">
        <div class="wk">Week 6</div>
        <div><h3>No Brainer</h3><p>Unit 6.</p><span class="tap">Reading and writing</span></div>
      </summary>
      <div class="wk2-body">
        <p>This week&rsquo;s two reading tasks and the writing task. Each opens in a new tab.</p>
        <div class="rdl">
          <h3>Reading 1</h3>
          <p>Academic Reading practice. Answer in the task, submit, then review the answers and the key vocabulary.</p>
          <a class="btn" href="https://gemini.google.com/share/2f91fa886bf3" target="_blank" rel="noopener">Open reading task 1</a>
        </div>
        <div class="rdl" style="margin-top:14px">
          <h3>Reading 2</h3>
          <p>Academic Reading practice. Answer in the task, submit, then review the answers and the key vocabulary.</p>
          <a class="btn" href="https://gemini.google.com/share/fb5ab3bd1162" target="_blank" rel="noopener">Open reading task 2</a>
        </div>
        <div class="rdl" style="margin-top:14px">
          <h3>Think Writing</h3>
          <p>This week&rsquo;s writing task.</p>
          <a class="btn" href="https://drive.google.com/file/d/1UJ2RvheRM1XJy47EDvxApb8FJEbNHZBN/view" target="_blank" rel="noopener">Open the writing task</a>
        </div>
      </div>
    </details>`;

  if (html.includes(old)) {
    html = html.replace(old, neu);
  }
  document.open();
  document.write(html);
  document.close();
})().catch(e => {
  document.body.innerHTML = '<div class="loading">Failed to load. <a href="https://raw.githubusercontent.com/AlbertCosmo/albertcosmo.github.io/dae3fe059936ffc073e0d57345f63d249b28e9df/89154/index.html">Open original</a></div>';
});
</script>
</body>
</html>
