<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Enrichment (F26): Course Introduction</title>
<meta name="description" content="Course introduction for English Enrichment, Ming Chuan University, Fall 2026. Instructor: Albert Le Thanh Nhan.">
<style>
  :root{
    --bg:#fbfaf8; --ink:#0d0d0d; --mute:#3f3e3b; --faint:#67655f;
    --rule:#ddd9d3; --accent:#6b1723; --card:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141414; --ink:#f5f3f0; --mute:#c8c6c2; --faint:#a09e9a;
           --rule:#343434; --accent:#eb9ba5; --card:#1c1c1c; }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:21px/1.66 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans TC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px; margin:0 auto; padding:76px 30px 100px}

  header{padding-bottom:34px; border-bottom:1px solid var(--rule)}
  h1{margin:0 0 6px; font-size:44px; line-height:1.16; font-weight:650; letter-spacing:-.018em}
  .han{font-weight:500; opacity:.78; margin-left:.18em}
  .role{margin:0 0 18px; color:var(--mute); font-size:20px}
  .site{display:inline-block; color:var(--accent); text-decoration:none;
        border-bottom:1px solid currentColor; padding-bottom:1px; font-size:19px; font-weight:500}
  .site:hover{opacity:.7}
  .course{margin-top:24px; font-size:15px; color:var(--faint); letter-spacing:.05em;
          text-transform:uppercase; font-weight:600}

  .facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(224px,1fr)); gap:1px;
         margin-top:34px; background:var(--rule); border:1px solid var(--rule); border-radius:10px;
         overflow:hidden}
  .facts div{background:var(--card); padding:17px 19px}
  .facts dt{font-size:13px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint);
            font-weight:700; margin-bottom:6px}
  .facts dd{margin:0; font-size:20px; color:var(--ink); font-weight:500}
  .facts dd a{color:var(--accent); text-decoration:none; border-bottom:1px solid currentColor;
              word-break:break-all}
  .facts dd a:hover{opacity:.7}
  .facts dd span{color:var(--mute); font-size:17px; font-weight:400}

  section{padding-top:52px}
  .num{font-size:14px; letter-spacing:.16em; color:var(--accent); font-weight:700; margin-bottom:10px}
  h2{margin:0 0 18px; font-size:32px; line-height:1.2; font-weight:650; letter-spacing:-.015em}
  p{margin:0 0 16px; color:var(--mute)}
  .lead{font-size:22px; line-height:1.55}

  .qr-row{display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap; margin:22px 0 6px}
  .qr{width:148px; height:148px; border-radius:10px; border:1px solid var(--rule); background:#fff;
      flex-shrink:0}
  .qr-meta{flex:1; min-width:200px}
  .qr-meta p{margin:0 0 12px; font-size:18px}
  .btn{display:inline-block; background:var(--accent); color:#fff; text-decoration:none;
       padding:11px 18px; border-radius:8px; font-size:17px; font-weight:600; letter-spacing:.01em}
  .btn:hover{opacity:.88}
  .btn.secondary{background:transparent; color:var(--accent); border:1.5px solid var(--accent)}

  .hours{display:grid; gap:18px; margin-top:8px}
  .hour{background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:20px 22px}
  .hour h3{margin:0 0 8px; font-size:20px; font-weight:650}
  .hour .tag{display:inline-block; font-size:12px; letter-spacing:.12em; text-transform:uppercase;
             color:var(--accent); font-weight:700; margin-bottom:10px}
  .hour ul{margin:0; padding-left:1.15em; color:var(--mute)}
  .hour li{margin-bottom:6px}

  .plan{margin-top:10px}
  .week, details.wk2 > summary.week{
    display:grid; grid-template-columns:88px 1fr; gap:14px 18px; padding:16px 0;
    border-bottom:1px solid var(--rule); list-style:none; cursor:pointer;
  }
  details.wk2 > summary.week::-webkit-details-marker{display:none}
  details.wk2 > summary.week::marker{content:""}
  .wk{font-size:14px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint);
      font-weight:700; padding-top:4px}
  .week h3, summary.week h3{margin:0 0 4px; font-size:20px; font-weight:650}
  .week p, summary.week p{margin:0; font-size:17px; color:var(--mute)}
  .due{display:inline-block; margin-top:6px; font-size:14px; color:var(--accent); font-weight:600}
  .tap{display:inline-block; margin-top:6px; font-size:14px; color:var(--faint); font-weight:500}
  .wk2-body{padding:4px 0 20px 106px}
  .wk2-body > p{margin:0 0 16px; font-size:17px}
  .rdl h3{margin:0 0 6px; font-size:18px; font-weight:650}
  .rdl p{margin:0 0 10px; font-size:16px}
  .quiz{background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:18px 20px; margin:14px 0}
  .quiz h3{margin:0 0 4px; font-size:19px}
  .score{font-size:15px; color:var(--faint); margin-bottom:14px}
  .q{margin-bottom:18px}
  .qt{margin:0 0 10px; font-size:17px; color:var(--ink)}
  .qn{display:inline-block; min-width:1.8em; color:var(--accent); font-weight:700; margin-right:4px}
  .opts{display:grid; gap:7px}
  .opt{text-align:left; background:var(--bg); border:1px solid var(--rule); border-radius:8px;
       padding:10px 12px; font:inherit; color:var(--ink); cursor:pointer; display:flex; gap:10px;
       align-items:flex-start}
  .opt:hover{border-color:var(--accent)}
  .opt .k{font-weight:700; color:var(--accent); min-width:1.1em}
  .opt.ok{background:rgba(40,140,70,.12); border-color:#2a8a48}
  .opt.bad{background:rgba(180,40,40,.1); border-color:#b43c3c}
  .fb{margin:8px 0 0; font-size:15px; color:var(--mute)}
  .fb-r{color:var(--ink)}
  .qdone .opt{pointer-events:none}
  .actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px}
  .actions button{font:inherit; font-size:15px; font-weight:600; padding:8px 14px; border-radius:7px;
                  border:1px solid var(--rule); background:var(--card); color:var(--ink); cursor:pointer}
  .actions button:hover{border-color:var(--accent)}

  footer{margin-top:64px; padding-top:22px; border-top:1px solid var(--rule);
         font-size:15px; color:var(--faint)}

  @media (max-width:560px){
    .wrap{padding:48px 18px 70px}
    h1{font-size:34px}
    .facts{grid-template-columns:1fr}
    .week, details.wk2 > summary.week{grid-template-columns:72px 1fr}
    .wk2-body{padding-left:0}
  }
</style>
</head>
<body>

</div>
</body>
</html>
